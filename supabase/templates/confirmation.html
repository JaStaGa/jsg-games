<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #0e0f3b; color: #ffffff; font-family: Arial, sans-serif">
    <div style="max-width: 560px; margin: 0 auto; padding: 32px 24px">
      <p style="color: #f7931e; font-weight: 700; letter-spacing: 0.08em">
        JSG GAMES
      </p>
      <h1 style="font-size: 28px">Confirm your email address</h1>
      <p style="color: #b9e7fa; line-height: 1.6">
        Follow this link to finish creating your JSG Games account.
      </p>
      <p style="margin-top: 24px">
        <a
          href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
          style="display: inline-block; padding: 12px 18px; background: #f7931e; color: #0e0f3b; font-weight: 700; text-decoration: none"
        >
          Confirm email address
        </a>
      </p>
      <p style="margin-top: 28px; color: #7fcdee; font-size: 14px; line-height: 1.5">
        If you did not request this account, you can ignore this email.
      </p>
    </div>
  </body>
</html>
